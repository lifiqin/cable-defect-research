[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cable-defect-research"
version = "0.1.0"
description = "Ablatable geometry-conditioned prototype for industrial defect detection"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "ultralytics==8.4.131", "PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["cable_research*"]

[tool.ruff]
line-length = 120
